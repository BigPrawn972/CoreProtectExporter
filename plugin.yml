name: CoreProtectExporter
version: '${project.version}'
main: tw.codex.coreprotectexporter.CoreProtectExporter
api-version: '${minecraft.version}'
depend: [CoreProtect]
description: Export a single CoreProtect lookup into split TSV files.
commands:
  coexport:
    description: Export one CoreProtect lookup to files.
    usage: /coexport time:30d action:+block include:end_crystal radius:100 center:<player>
    permission: coreprotectexport.use
permissions:
  coreprotectexport.use:
    description: Run CoreProtect lookup exports.
    default: op
